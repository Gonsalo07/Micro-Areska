spring.application.name=areska-category-services
server.port=8084


# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/areska
spring.datasource.username=postgres
spring.datasource.password=Gonsalo123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
