server:
  port: 8090

spring:
  application:
    name: areska-gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - AuthenticationFilter
      routes:
        - id: category-service
          uri: lb://ARESKA-CATEGORY-SERVICES
          predicates:
            - Path=/api/categories/**
          filters:
            - StripPrefix=1
        - id: delivery-service
          uri: lb://ARESKA-DELIVERY-SERVICE
          predicates:
            - Path=/api/deliveries/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: lb://ARESKA-ORDER-SERVICE
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
        - id: payment-service
          uri: lb://ARESKA-PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
        - id: product-service
          uri: lb://ARESKA-PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: lb://ARESKA-USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

firebase:
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
