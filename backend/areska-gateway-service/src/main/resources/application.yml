# =====================================================
# CONFIGURACIÓN MÍNIMA - El resto viene del Config Server
# Ver: config-repo/areska-gateway-service.yml
# =====================================================
server:
  port: ${PORT:8090}

spring:
  application:
    name: areska-gateway-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

# Firebase - Variables de entorno
firebase:
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

# Eureka - Para desarrollo local
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_USE_IP:false}
    hostname: ${HOSTNAME:localhost}

