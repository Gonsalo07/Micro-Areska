version: '3.8'

services:
  # ==========================================
  # Infraestructura Base
  # ==========================================
  
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootsql
      POSTGRES_DB: areska
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - areska-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - areska-network

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - areska-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - areska-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - areska-network

  # ==========================================
  # Servicios de Configuración y Descubrimiento
  # ==========================================

  config-server:
    build: 
      context: ./areska-config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/app/config-repo/
    volumes:
      - ./config-repo:/app/config-repo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - areska-network

  eureka-server:
    build: 
      context: ./areska-eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_CONFIG_IMPORT: "optional:http://config-server:8888"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - areska-network

  # ==========================================
  # Servicios de Dominio
  # ==========================================

  user-service:
    build: 
      context: ./areska-user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_HOST_USER: postgres
      DB_PORT_USER: 5432
      DB_NAME_USER: areska
      DB_USERNAME_USER: postgres
      DB_PASSWORD_USER: rootsql
      # Esto le dice a Spring que use el nombre exacto que tienes en el config-repo
      SPRING_APPLICATION_NAME: areska-user-service
      # Esto simula tus 'Start-Sleep': si falla, reintenta 20 veces
      SPRING_CLOUD_CONFIG_FAIL_FAST: true
      SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS : 5
      SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL: 3000
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - areska-network

  product-service:
    build: 
      context: ./areska-product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_HOST_PRODUCT: postgres
      DB_PORT_PRODUCT: 5432
      DB_NAME_PRODUCT: areska
      DB_USERNAME_PRODUCT: postgres
      DB_PASSWORD_PRODUCT: rootsql
      # Esto le dice a Spring que use el nombre exacto que tienes en el config-repo
      SPRING_APPLICATION_NAME: areska-product-service
      # Esto simula tus 'Start-Sleep': si falla, reintenta 20 veces
      SPRING_CLOUD_CONFIG_FAIL_FAST: true
      SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS : 5
      SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL: 3000
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - areska-network

  order-service:
    build: 
      context: ./areska-order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8084:8084"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_HOST_ORDER: postgres
      DB_PORT_ORDER: 5432
      DB_NAME_ORDER: areska
      DB_USERNAME_ORDER: postgres
      DB_PASSWORD_ORDER: rootsql
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      ORDER_SERVICE_PORT: 8084
      # Esto le dice a Spring que use el nombre exacto que tienes en el config-repo
      SPRING_APPLICATION_NAME: areska-order-service
      # Esto simula tus 'Start-Sleep': si falla, reintenta 20 veces
      SPRING_CLOUD_CONFIG_FAIL_FAST: true
      SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS : 5
      SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL: 3000
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - areska-network
  
  payment-service:
    build: 
      context: ./areska-payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_HOST_PAYMENT: postgres
      DB_PORT_PAYMENT: 5432
      DB_NAME_PAYMENT: areska
      DB_USERNAME_PAYMENT: postgres
      DB_PASSWORD_PAYMENT: rootsql
      # Esto le dice a Spring que use el nombre exacto que tienes en el config-repo
      SPRING_APPLICATION_NAME: areska-payment-service
      # Esto simula tus 'Start-Sleep': si falla, reintenta 20 veces
      SPRING_CLOUD_CONFIG_FAIL_FAST: true
      SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS : 5
      SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL: 3000
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - areska-network

  delivery-service:
    build: 
      context: ./areska-delivery-service
      dockerfile: Dockerfile
    container_name: delivery-service
    ports:
      - "8085:8085"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_HOST_DELIVERY: postgres
      DB_PORT_DELIVERY: 5432
      DB_NAME_DELIVERY: areska
      DB_USERNAME_DELIVERY: postgres
      DB_PASSWORD_DELIVERY: rootsql
      # Esto le dice a Spring que use el nombre exacto que tienes en el config-repo
      SPRING_APPLICATION_NAME: areska-delivery-service
      # Esto simula tus 'Start-Sleep': si falla, reintenta 20 veces
      SPRING_CLOUD_CONFIG_FAIL_FAST: true
      SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS : 5
      SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL: 3000
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - areska-network

  # ==========================================
  # API Gateway
  # ==========================================

  gateway-service:
    build: 
      context: ./areska-gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8090:8090"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:8090}
      FIREBASE_CONFIG_PATH: /app/firebase-service-account.json
      EUREKA_USE_IP: "true"
    volumes:
      - ./areska-gateway-service/firebase-service-account.json:/app/firebase-service-account.json
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - areska-network

  # ==========================================
  # Observabilidad
  # ==========================================

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - delivery-service
      - gateway-service
    networks:
      - areska-network

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    networks:
      - areska-network

networks:
  areska-network:
    driver: bridge

volumes:
  postgres_data:
