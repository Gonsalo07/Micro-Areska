# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST_DELIVERY:localhost}:${DB_PORT_DELIVERY:5432}/${DB_NAME_DELIVERY:areska}
spring.datasource.username=${DB_USERNAME_DELIVERY:postgres}
spring.datasource.password=${DB_PASSWORD_DELIVERY:rootsql}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Delivery Queue
delivery.queue.name=delivery.orders.queue
server.port=${DELIVERY_SERVICE_PORT:8085}

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=areska-delivery-service

# Zipkin / Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans