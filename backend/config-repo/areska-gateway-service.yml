server:
  port: ${PORT:8090}

spring:
  application:
    name: areska-gateway-service
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000,http://localhost:3001,http://localhost:8090"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders:
              - "X-Firebase-UiD"
              - "X-Firebase-Email"
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - AuthenticationFilter
      routes:
        - id: category-service
          uri: lb://ARESKA-PRODUCT-SERVICE
          predicates:
            - Path=/api/categories/**
          filters:
            - StripPrefix=1
        - id: delivery-service
          uri: lb://ARESKA-DELIVERY-SERVICE
          predicates:
            - Path=/api/deliveries/**
          filters:
            - StripPrefix=1
        - id: delivery-drivers-service
          uri: lb://ARESKA-DELIVERY-SERVICE
          predicates:
            - Path=/api/delivery-drivers/**
          filters:
            - StripPrefix=1
        - id: order-deliveries-service
          uri: lb://ARESKA-DELIVERY-SERVICE
          predicates:
            - Path=/api/order-deliveries/**
          filters:
            - StripPrefix=1
        - id: delivery-driver-notifications-service
          uri: lb://ARESKA-DELIVERY-SERVICE
          predicates:
            - Path=/api/delivery-driver-notifications/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: lb://ARESKA-ORDER-SERVICE
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
        - id: chat-messages-service
          uri: lb://ARESKA-ORDER-SERVICE
          predicates:
            - Path=/api/chat-messages/**
          filters:
            - StripPrefix=1
        - id: websocket-service
          uri: lb://ARESKA-ORDER-SERVICE
          predicates:
            - Path=/api/ws/**
          filters:
            - StripPrefix=1
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
        - id: delivery-websocket-service
          uri: lb://ARESKA-DELIVERY-SERVICE
          predicates:
            - Path=/api/delivery-ws/**
          filters:
            - StripPrefix=1
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
        - id: payment-service
          uri: lb://ARESKA-PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
        - id: product-service
          uri: lb://ARESKA-PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: lb://ARESKA-USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

# Firebase Configuration
firebase:
  config:
    path: ${FIREBASE_CONFIG_PATH:firebase-service-account.json}
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  project-id: ${FIREBASE_PROJECT_ID:}
  private-key-id: ${FIREBASE_PRIVATE_KEY_ID:}
  private-key: ${FIREBASE_PRIVATE_KEY:}
  client-email: ${FIREBASE_CLIENT_EMAIL:}
  client-id: ${FIREBASE_CLIENT_ID:}

